    // ----------------------------------------------------
    // 2. 엑셀 파일 직접 업로드 처리 (SheetJS 연동)
    // ----------------------------------------------------
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          let parsedCount = 0;
          const detectedSite = file.name.includes("IBK") ? "IBK몰" : (file.name.includes("베네") || file.name.includes("bene") ? "베네카페" : "IBK몰");

          workbook.SheetNames.forEach(sheetName => {
            const worksheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
            
            rows.forEach(row => {
              // 컬럼명 유연한 자동 매핑
              const keys = Object.keys(row);
              const nameKey = keys.find(k => k.includes("상품") || k.includes("품목") || k.includes("제품") || k.includes("이름"));
              const welfareKey = keys.find(k => k.includes("복지") || k.includes("배정") || k.includes("포인트") || k.includes("가격") || k.includes("금액"));
              const marketKey = keys.find(k => k.includes("최저가") || k.includes("시중") || k.includes("실거래") || k.includes("네이버") || k.includes("실시간"));
              const noteKey = keys.find(k => k.includes("비고") || k.includes("메모") || k.includes("추천") || k.includes("설명"));
              const siteKey = keys.find(k => k.includes("사이트") || k.includes("몰") || k.includes("구분"));

              if (nameKey && row[nameKey]) {
                const name = String(row[nameKey]).trim();
                let welfare = welfareKey ? parseInt(String(row[welfareKey]).replace(/[^0-9]/g, '')) : 0;
                let market = marketKey ? parseInt(String(row[marketKey]).replace(/[^0-9]/g, '')) : 0;
                const site = (siteKey && row[siteKey]) ? String(row[siteKey]).trim() : detectedSite;
                const note = (noteKey && row[noteKey]) ? String(row[noteKey]).trim() : "엑셀 파일에서 직접 동기화된 상품입니다.";

                if (!welfare || isNaN(welfare)) welfare = 100000;
                if (!market || isNaN(market)) market = Math.round(welfare * 1.25);

                itemsDatabase.push({
                  site: site,
                  name: name,
                  welfare: welfare,
                  market: market,
                  tag: "엑셀동기화",
                  note: note
                });
                parsedCount++;
              }
            });
          });

          if (parsedCount > 0) {
            alert(`성공! [${file.name}] 파일에서 총 ${parsedCount}개 상품을 성공적으로 불러왔습니다.`);
            renderApp();
          } else {
            alert("엑셀 파일에서 유효한 상품 데이터를 찾지 못했습니다. 컬럼명을 확인해주세요.");
          }
        } catch (err) {
          console.error(err);
          alert("엑셀 파일 파싱 중 오류가 발생했습니다: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // ----------------------------------------------------
    // 3. 필터 제어
    // ----------------------------------------------------
    function setSite(site) {
      currentSite = site;
      document.querySelectorAll('.site-btn').forEach(btn => {
        if (btn.dataset.site === site) {
          btn.className = "site-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-orange-600 shadow-sm";
        } else {
          btn.className = "site-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white/60";
        }
      });
      renderApp();
    }

    function setPrice(price) {
      currentPrice = price;
      document.querySelectorAll('.price-btn').forEach(btn => {
        if (btn.dataset.price === price) {
          btn.className = "price-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-orange-600 shadow-sm";
        } else {
          btn.className = "price-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white/60";
        }
      });
      renderApp();
    }

    // ----------------------------------------------------
    // 4. 핵심 렌더링 함수
    // ----------------------------------------------------
    function renderApp() {
      // 1. 차익 및 수익률 연산
      const processed = itemsDatabase.map(item => {
        const margin = item.market - item.welfare;
        const rate = Math.round((margin / item.welfare) * 100);
        let grade = "B";
        if (margin >= 80000 || rate >= 60) grade = "S+";
        else if (margin >= 40000 || rate >= 30) grade = "S";
        else if (margin >= 20000 || rate >= 15) grade = "A";
        else if (margin <= 0) grade = "D";

        return { ...item, margin, rate, grade };
      });

      // 배지 개수 갱신
      const beneCount = processed.filter(i => i.site.includes("베네카페")).length;
      const ibkCount = processed.filter(i => i.site.includes("IBK")).length;
      document.getElementById('countAll').textContent = processed.length;
      document.getElementById('countBene').textContent = beneCount;
      document.getElementById('countIbk').textContent = ibkCount;

      // 2. 필터링
      const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const sortBy = document.getElementById('sortBy').value;

      let filtered = processed.filter(item => {
        const matchSite = (currentSite === 'ALL') || item.site.includes(currentSite);
        const matchPrice = (currentPrice === 'ALL') || (item.welfare === parseInt(currentPrice));
        const matchSearch = !search || 
          item.name.toLowerCase().includes(search) || 
          item.tag.toLowerCase().includes(search) || 
          item.site.toLowerCase().includes(search);
        return matchSite && matchPrice && matchSearch;
      });

      // 3. 정렬
      filtered.sort((a, b) => {
        if (sortBy === 'margin_desc') return b.margin - a.margin;
        if (sortBy === 'margin_asc') return a.margin - b.margin;
        if (sortBy === 'rate_desc') return b.rate - a.rate;
        if (sortBy === 'market_desc') return b.market - a.market;
        return 0;
      });

      document.getElementById('currentFilteredText').textContent = `조회 결과: ${filtered.length}개 품목 (${currentSite === 'ALL' ? '전체 몰' : currentSite})`;

      // 4. TOP 3 렌더링 (안전한 ID 매핑)
      const top3 = [...filtered].sort((a, b) => b.margin - a.margin).slice(0, 3);
      renderTopCards(top3);

      // 5. 테이블 렌더링
      renderTable(filtered);
    }

    function renderTopCards(top3) {
      const container = document.getElementById('topCardsContainer');
      if (!container) return;

      if (top3.length === 0) {
        container.innerHTML = `<div class="col-span-3 text-center py-6 text-slate-400 text-xs">일치하는 상품이 없습니다.</div>`;
        return;
      }

      const medals = ['🥇 1위 (최고의 선택)', '🥈 2위 (강력 추천)', '🥉 3위 (실속형)'];
      const bgColors = ['border-amber-400 bg-amber-50/50', 'border-slate-300 bg-white', 'border-slate-300 bg-white'];

      container.innerHTML = top3.map((item, idx) => `
        <div class="rounded-xl p-4 border ${bgColors[idx]} shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full">${medals[idx]}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${item.site.includes('베네') ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">${item.site}</span>
              </div>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-orange-500 text-white">${item.grade}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-sm line-clamp-2 leading-snug">${item.name}</h3>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${item.note}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-end justify-between">
            <div>
              <span class="text-[10px] text-slate-400 block">복지가: ${item.welfare.toLocaleString()}원</span>
              <span class="text-xs font-semibold text-slate-700">시중가: ~${item.market.toLocaleString()}원</span>
            </div>
            <div class="text-right">
              <span class="text-xs font-extrabold text-orange-600 block">+${item.margin.toLocaleString()}원 이득</span>
              <span class="text-[10px] font-semibold text-emerald-600">수익률 +${item.rate}%</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      if (!tbody) return;

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-slate-400 text-xs">검색 조건에 일치하는 품목이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map((item, idx) => {
        const isPlus = item.margin > 0;
        const isZero = item.margin === 0;
        const profitClass = isPlus ? 'text-emerald-600 font-bold' : (isZero ? 'text-slate-400' : 'text-rose-500 font-bold');
        const profitSign = isPlus ? '+' : '';
        const cleanQuery = encodeURIComponent(item.name.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim());
        const naverUrl = `https://search.shopping.naver.com/search/all?query=${cleanQuery}`;
        const siteBadgeStyle = item.site.includes('베네') 
          ? 'bg-orange-50 text-orange-700 border border-orange-200' 
          : 'bg-blue-50 text-blue-700 border border-blue-200';

        return `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="py-3 px-3 text-center font-bold text-slate-400 text-xs font-mono">${idx + 1}</td>
            <td class="py-3 px-3 text-center">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${siteBadgeStyle}">${item.site}</span>
            </td>
            <td class="py-3 px-4 font-medium text-slate-800 max-w-xs">
              <div class="truncate" title="${item.name}">${item.name}</div>
              <span class="inline-block mt-0.5 text-[10px] px-1.5 py-0.2 rounded bg-slate-100 text-slate-500 font-semibold">${item.tag}</span>
            </td>
            <td class="py-3 px-4 text-right text-slate-500 text-xs font-mono">${item.welfare.toLocaleString()}원</td>
            <td class="py-3 px-4 text-right text-slate-700 font-semibold text-xs font-mono">${item.market.toLocaleString()}원</td>
            <td class="py-3 px-4 text-right ${profitClass} text-xs font-mono">
              ${profitSign}${item.margin.toLocaleString()}원
            </td>
            <td class="py-3 px-3 text-center text-xs font-mono font-medium ${isPlus ? 'text-emerald-600' : 'text-slate-400'}">
              ${isPlus ? '+' : ''}${item.rate}%
            </td>
            <td class="py-3 px-4 text-xs text-slate-600 max-w-sm leading-relaxed">${item.note}</td>
            <td class="py-3 px-3 text-center">
              <a href="${naverUrl}" target="_blank" class="inline-flex items-center gap-1 text-[11px] font-semibold text-blue-600 hover:text-blue-800 hover:underline">
                <i class="ph ph-arrow-square-out"></i> 검색
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function copySummary() {
      const topItem = [...itemsDatabase].map(item => ({ ...item, margin: item.market - item.welfare, rate: Math.round(((item.market - item.welfare)/item.welfare)*100) })).sort((a, b) => b.margin - a.margin)[0];
      const text = `📢 [명절 복지몰 통합 가성비 1등 추천]\n👑 [${topItem.site}] ${topItem.name}\n- 복지 배정가: ${topItem.welfare.toLocaleString()}원\n- 시중 최저가: ~${topItem.market.toLocaleString()}원\n- 실질 이득: +${topItem.margin.toLocaleString()}원 (+${topItem.rate}%)\n💡 분석: ${topItem.note}`;
      
      navigator.clipboard.writeText(text).then(() => {
        alert('현재 조건 1위 추천 꿀템 정보가 클립보드에 복사되었습니다!\n사내 메신저나 팀 채팅방에 바로 공유해보세요.');
      });
    }

    function downloadCSV() {
      let csv = "\uFEFF순위,몰구분,상품명,태그,복지몰가,시중최저가,실질차익,수익률,비고\n";
      const processed = itemsDatabase.map(item => ({ ...item, margin: item.market - item.welfare, rate: Math.round(((item.market - item.welfare)/item.welfare)*100) })).sort((a, b) => b.margin - a.margin);
      processed.forEach((item, i) => {
        csv += `"${i+1}","${item.site}","${item.name}","${item.tag}",${item.welfare},${item.market},${item.margin},"${item.rate}%","${item.note}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "복지몰_베네카페_IBK몰_통합비교표.csv";
      link.click();
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
